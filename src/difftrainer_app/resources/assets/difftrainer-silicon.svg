    <g fill="none" stroke="#647B9E" stroke-width="8" stroke-linecap="round">
      <path d="M100 18v24M160 18v24M220 18v24M280 18v24M100 372v24M160 372v24M220 372v24M280 372v24"/>
      <path d="M18 100h24M18 160h24M18 220h24M18 280h24M372 100h24M372 160h24M372 220h24M372 280h24"/>
