     width="1280" height="640" viewBox="0 0 1280 640">
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>DiffTrainer Silicon</dc:title>
        <dc:creator><cc:Agent><dc:title>Xiao</dc:title></cc:Agent></dc:creator>
        <dc:description>DiffTrainer Silicon project artwork, designed by Xiao.</dc:description>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10162B"/>
      <stop offset="1" stop-color="#1D2944"/>
