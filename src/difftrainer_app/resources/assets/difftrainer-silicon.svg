  <rect width="1280" height="640" rx="54" fill="url(#bg)"/>
  <circle cx="356" cy="320" r="232" fill="url(#glow)"/>

  <g transform="translate(150 137)">
    <rect x="42" y="42" width="330" height="330" rx="72"
